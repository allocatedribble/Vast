; LogiUE editor play settings.
;
; Run editor-launched standalone / new-process "Play" sessions on Unreal's mimalloc allocator.
; UE 5.8 ships FMallocMimalloc; the editor and PIE already default to mimalloc, but a *separate* game
; process defaults to Binned2/3 — this switch brings those runs onto mimalloc too, matching the Rust
; cdylibs (logi_ffi.dll / logi_geo.dll) which now use mimalloc as their global allocator.
;
; The -mimalloc switch is honored in every non-Shipping build (see WindowsPlatformMemory.cpp
; BaseAllocator(), guarded by `#if !UE_BUILD_SHIPPING`). For a *packaged* Development build, pass
; -mimalloc on the executable's command line (this editor setting only covers editor-launched runs).
; Shipping ignores the switch — its allocator is compiled in and would require a UE source build to change.
[/Script/UnrealEd.LevelEditorPlaySettings]
AdditionalLaunchParameters=-mimalloc
