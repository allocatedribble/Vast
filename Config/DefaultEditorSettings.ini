; LogiUE editor settings (classes with UCLASS(config=EditorSettings) — NOT EditorPerProjectUserSettings;
; UE 5.8 moved UEditorPerformanceSettings here).

; Geo bench harness: keep the editor TICKING AND RENDERING when unfocused. The editor's default
; "Use Less CPU when in Background" throttles the engine loop to ~1 Hz without focus, which (a) stops the
; editor-world geo actor from streaming whenever another window is active and (b) made every automated
; verification session focus-dependent. The bench runner also forces this off at run start; this default
; removes the background throttle for every session. (Per-user Saved/ config can still override locally.)
[/Script/UnrealEd.EditorPerformanceSettings]
bThrottleCPUWhenNotForeground=False
