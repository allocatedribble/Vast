# cbindgen config: generates crates/logi_ffi/include/logi_bevy_ffi.h from the
# logi_ffi public C ABI. Run from Rust/crates/logi_ffi:
#   cbindgen --config ../../cbindgen.toml --crate logi_ffi --output include/logi_bevy_ffi.h
# The generated header is CHECKED IN and consumed by the LogiBevy C++ plugin.

language = "C"
pragma_once = true
include_guard = "LOGI_BEVY_FFI_H"
autogen_warning = "/* Generated by cbindgen. DO NOT EDIT by hand. Regenerate from Rust/crates/logi_ffi. */"
cpp_compat = true
documentation = true
style = "type"

# The handle target is a boxed Rust `LogiRuntime` (non-C, lives in logi_runtime),
# so cbindgen can't see its layout. Forward-declare it as an opaque struct.
after_includes = "\n/* Opaque: a boxed Rust LogiRuntime instance (crate logi_runtime). */\ntypedef struct LogiRuntime LogiRuntime;"

[parse]
parse_deps = true
include = ["logi_ffi", "logi_render_extract", "logi_schema"]

[export]
# Emit the opaque runtime handle as a forward-declared struct.
