[package]
name = "logi_terrain_ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# Output name is `logi_terrain` so the Unity plugin / DllImport name is stable across the restructure.
name = "logi_terrain"
crate-type = ["cdylib", "rlib"]

[dependencies]
logi_terrain_core = { path = "../logi_terrain_core" }
logi_terrain_scene = { path = "../logi_terrain_scene" }
# M1 (ADR-0009): the AGI_HQ building loader, exposed additively alongside the terrain world.
logi_3dtiles_scene = { path = "../logi_3dtiles_scene" }
# M2 globe: the persistent on-disk tile cache (DiskCache), built here so an open failure degrades cleanly.
logi_3dtiles_io = { path = "../logi_3dtiles_io" }
