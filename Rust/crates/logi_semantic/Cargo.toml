[package]
name = "logi_semantic"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# WIP: the future voxel terrain lane (dual contouring / SDF). Off by default — compiles a skeleton only.
voxel = []

[dependencies]
# The fetch contract BakedTileSource implements (RequestId / Loaded / TileContentSource).
logi_3dtiles_io = { path = "../logi_3dtiles_io" }
