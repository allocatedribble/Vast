[package]
name = "logi_ffi"
edition.workspace = true
version.workspace = true
publish = false

# cdylib (delay-loaded DLL) — the link strategy the Build.cs uses today (it links `logi_ffi.dll.lib`).
# The staticlib was emitted "in case" but is never linked, so it only cost build time (LTO +
# codegen-units=1) on every cargo run (ADR-0004: don't build what nothing uses). Re-add "staticlib" here
# together with the Build.cs switch when profiling justifies it (ADR-0005 / AGENTS.md § 5).
[lib]
crate-type = ["cdylib"]

[features]
default = []
# Editor-only entity introspection ABI (ADR-0006). Enabled by the Unreal editor
# build only; produces the logi_editor_* exports + logi_bevy_editor_ffi.h.
editor_inspector = ["logi_runtime/editor_inspector"]

[dependencies]
logi_runtime = { path = "../logi_runtime" }
logi_render_extract = { path = "../logi_render_extract" }
logi_schema = { path = "../logi_schema" }
thiserror = { workspace = true }
# Global allocator for this cdylib's Rust heap (set in lib.rs). Governs only logi_ffi.dll's own
# allocations; Unreal keeps its allocator. FFI hands out pointer+len views, never ownership (§1A).
mimalloc = { workspace = true }
