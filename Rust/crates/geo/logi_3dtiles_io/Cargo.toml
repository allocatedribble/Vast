[package]
name = "logi_3dtiles_io"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Production HTTP backend: blocking ureq (rustls TLS) + the url crate for tile-URL resolution. NO tokio —
# the streaming kernel is single-owner-thread; HTTP runs on a worker pool draining into poll_completed.
# `gzip` is pinned EXPLICITLY (it is a ureq default, but P3DT/tileset decode depends on transparent
# `Content-Encoding: gzip` inflation in `into_reader()` — a future `default-features = false` would otherwise
# silently break all GLB/tileset decoding with no compile error).
ureq = { version = "2", features = ["gzip"] }
url = "2"
# MPMC channels for the fetch worker pool: request fan-out to N workers, results drained on the owner thread.
flume = { workspace = true }
# SwissTable maps/sets for the pending / in-flight / disk-cache bookkeeping.
hashbrown = { workspace = true }

[dev-dependencies]
# For the live P3DT streaming example (resolve → fetch → parse → fetch a tile → attempt decode).
logi_3dtiles_ion = { path = "../logi_3dtiles_ion" }
logi_3dtiles_tileset = { path = "../logi_3dtiles_tileset" }
logi_gltf = { path = "../logi_gltf" }
