[package]
name = "logi_3dtiles_scene"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# COLLADA decode for the standalone `load_building` side lane (.dae → UE render space).
logi_collada = { path = "../logi_collada" }
logi_geospatial = { path = "../logi_geospatial" }
glam = { workspace = true }
# SwissTable maps/sets for the streaming bookkeeping (tile index, in-flight, grafts, mesh cache).
hashbrown = { workspace = true }
# The streaming tileset world (3D Tiles): traversal + worker-pool fetch + glTF decode + ECEF→ENU rebase.
logi_3dtiles_tileset = { path = "../logi_3dtiles_tileset" }
logi_3dtiles_select = { path = "../logi_3dtiles_select" }
# Implicit tiling (3D Tiles 1.1): the `.subtree` codec the scene fetches + caches to drive the implicit
# traversal (`select_tree_implicit`). NOTE: production Google P3DT (tile.googleapis.com) is actually
# GRAFTED-EXPLICIT — a tree of external `tileset.json` files joined by `content.uri` references and grafted at
# runtime (`graft_external`), NOT implicit subtrees; this codec serves the implicit lane for other providers /
# the implicit P3DT variant. (Earlier comment wrongly said P3DT subdivides procedurally — it does not.)
logi_3dtiles_implicit = { path = "../logi_3dtiles_implicit" }
logi_3dtiles_io = { path = "../logi_3dtiles_io" }
logi_gltf = { path = "../logi_gltf" }
# Shared render-geometry home: ENU<->UE conversion + AABB sphere (audit M21/DUP-5, AGENTS.md §1A).
logi_geo_mesh = { path = "../logi_geo_mesh" }
# ion endpoint resolution for the `from_ion` convenience constructor (resolve → fetch root → build world).
logi_3dtiles_ion = { path = "../logi_3dtiles_ion" }
# Whole-vertex f32 slice casts in the ECEF→ENU rebase (audit M12) — read/write the interleaved 32-byte
# vertices as [f32] in one checked cast instead of byte-bashing each of the 8 floats individually.
bytemuck = "1"
# Surface external-tileset graft failures (audit M17) instead of silently dropping the subtree.
tracing = { workspace = true }
# Geo ECS orchestration (ADR-0012 Addendum A): tiles become entities and the stream thread runs a bevy_ecs
# schedule whose heavy systems `par_iter` on the SHARED ComputeTaskPool. This is the one geo crate that takes
# a bevy dependency — the orchestration layer. Rationale + constraints: Docs/Research/ECS-Multithreading-for-Geo.md.
bevy_ecs = { workspace = true }
bevy_tasks = { workspace = true }
