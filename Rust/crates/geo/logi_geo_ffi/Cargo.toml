[package]
name = "logi_geo_ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# Output name is `logi_geo` so the Unreal plugin / delay-load name is stable across the restructure.
name = "logi_geo"
crate-type = ["cdylib", "rlib"]

[dependencies]
# M1 (ADR-0009): the AGI_HQ building loader, exposed additively alongside the globe/baked lanes.
logi_3dtiles_scene = { path = "../logi_3dtiles_scene" }
# M2 globe: the persistent on-disk tile cache (DiskCache), built here so an open failure degrades cleanly.
logi_3dtiles_io = { path = "../logi_3dtiles_io" }
# HE-0 (ADR-0011): the baked semantic-tile world (open store -> render meshes), exposed additively.
logi_semantic = { path = "../logi_semantic" }
# Procedural-terrain origin (lon/lat/height) → ECEF for the one-engine procedural lane.
logi_geospatial = { path = "../logi_geospatial" }
# ENU→UE axis map for the v15 sky anchor (earth center in render space) — geodesy single-homed in Rust.
logi_geo_mesh = { path = "../logi_geo_mesh" }
# LogiSky S2 (ADR-0022): the Rust-owned atmosphere model behind the v18 sky lane (frame + LUT sentences).
logi_sky = { path = "../logi_sky" }
glam = { workspace = true }
# Global allocator for the logi_geo.dll Rust heap (set in lib.rs). Same contract as logi_ffi.
mimalloc = { workspace = true }
# SwissTable membership set reused on the per-frame baked-tile select path (ffi_baked).
hashbrown = { workspace = true }

[features]
# Forwards the HTTP/2 CyperSource fetch lane down through the scene crate. Now ON BY DEFAULT — the live keyed
# P3DT A/B promoted it, so the shipping `logi_geo` cdylib carries the h2 lane and `from_ion`'s Auto policy
# selects CyperSource for Google P3DT (LogiRuntime plan §7.1). The runtime FFI `fetch_backend` knob
# (LogiGlobeCreateInfo, ABI v11) then chooses Auto / force-ureq / force-cyper at world-create time. Build
# `--no-default-features` for the lean ureq-only cdylib (no h2/hyper/compio stack).
default = ["cyper-h2"]
cyper-h2 = ["logi_3dtiles_scene/cyper-h2"]
