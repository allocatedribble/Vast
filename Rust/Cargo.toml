# LogiUE simulation workspace — the gameplay authority (ADR-0005).
# bevy_ecs is used as a LIBRARY. Never depend on bevy_render/bevy_window/wgpu/
# bevy_audio or the umbrella `bevy` crate — Unreal renders; Bevy only simulates.
#
# Versions are pinned here and the resolved set is committed in Cargo.lock.

[workspace]
resolver = "2"
members = [
	"crates/logi_ffi",
	"crates/logi_runtime",
	"crates/logi_sim",
	"crates/logi_render_extract",
	"crates/logi_schema",
	# Terrain kernel (ADR-0007), ported from the prior Unity Logi workspace.
	"crates/logi_terrain_core",
	"crates/logi_terrain_geo",
	"crates/logi_terrain_pack",
	"crates/logi_terrain_cache",
	"crates/logi_terrain_decode",
	"crates/logi_terrain_procgen",
	"crates/logi_terrain_lod",
	"crates/logi_terrain_stream",
	"crates/logi_terrain_scene",
	"crates/logi_terrain_ffi",
	"crates/logi_terrain_tools",
	# 3D Tiles / real-world terrain stack (Milestone F, ADR-0009).
	"crates/logi_geospatial",
	"crates/logi_qmesh",
	"crates/logi_3dtiles_tileset",
	"crates/logi_3dtiles_implicit",
	"crates/logi_3dtiles_select",
	"crates/logi_gltf",
	"crates/logi_3dtiles_io",
	"crates/logi_collada",
	"crates/logi_3dtiles_scene",
	"crates/logi_3dtiles_ion",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Proprietary"

[workspace.dependencies]
bevy_ecs = "0.18.1"
bevy_tasks = "0.18.1"
bevy_app = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
glam = "0.30"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
